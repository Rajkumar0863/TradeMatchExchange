# ===========================
# Application
# ===========================
spring.application.name=TradeMatchExchange


# ===========================
# PostgreSQL
# ===========================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tradematchexchange}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver


# ===========================
# JPA / Hibernate
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# REST API does not rely on lazy-loaded entities
# after the service transaction has completed.
spring.jpa.open-in-view=false


# ===========================
# Swagger / OpenAPI
# ===========================
springdoc.swagger-ui.path=/swagger-ui.html